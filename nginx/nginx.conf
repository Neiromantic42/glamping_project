events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    upstream django {
        server web:8000;
    }

    # =========================
    # HTTP -> HTTPS редирект
    # =========================
    server {
        listen 80;
        server_name kama-glamping.ru www.kama-glamping.ru;

        return 301 https://$host$request_uri;
    }

    # =========================
    # HTTPS сервер
    # =========================
    server {
        listen 443 ssl;
        server_name kama-glamping.ru www.kama-glamping.ru;

        ssl_certificate /etc/letsencrypt/live/kama-glamping.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kama-glamping.ru/privkey.pem;

        client_max_body_size 20M;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /robots.txt {
            alias /app/staticfiles/robots.txt;
        }

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
        }
    }
}