{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вход — /\ Кама ГЛ</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

    <!-- Фон с overlay -->
    <div class="login-bg"></div>
    <div class="overlay"></div>

    <!-- Контейнер входа -->
    <div class="login-container">

        <!-- Карточка формы -->
        <div class="login-card">

            <!-- Заголовок -->
            <div class="login-header">
                <h1>/\ Кама ГЛ</h1>
                <p>Войдите в свой аккаунт</p>
            </div>

            {% if messages %}
            	<div class="messages">
                    {% for message in messages %}
                    	<div class="message {{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}


            <!-- Форма входа -->
            <form method="POST" action="{% url 'users:login' %}" class="login-form">
                {% csrf_token %}

                <!-- Username или Email -->
                <div class="form-group">
                    <label for="username">Имя пользователя или Email <span class="required">*</span></label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Введите логин или email"
                        required
                        autocomplete="username"
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Пароль <span class="required">*</span></label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Введите пароль"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <!-- Запомнить меня + Забыли пароль -->
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember_me">
                        <span>Запомнить меня</span>
                    </label>
                    <a href="{% url 'users:password_reset' %}" class="forgot-password">Забыли пароль?</a>
                </div>

                <!-- Кнопка входа -->
                <button type="submit" class="btn-login">
                    Войти
                </button>

                <!-- Ссылка на регистрацию -->
                <div class="register-link">
                    Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a>
                </div>

                <!-- Ссылка назад -->
                <a href="{% url 'glamping:home_page' %}" class="btn-back">← Вернуться на главную</a>

            </form>

        </div>

    </div>

</body>
</html>
